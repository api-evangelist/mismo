findings:
- id: governed-in-the-open-distributed-behind-a-wall
  observation: >-
    MISMO publishes its governance in full — 14 bodies, 89 named people with employers — while
    the standards those bodies produce sit behind a $3,500 annual membership and a licence
    agreement. That is the inverse of CAMARA and NMFTA, which publish the specification openly
    and the people barely at all.
- id: openapi-inside-the-wall
  observation: >-
    The v3.6 Reference Model includes a YAML file set conforming to the OpenAPI Specification,
    plus a MISMO API Toolkit and concrete services such as a FIPS Code API. The largest data
    standard in US mortgage has an HTTP-contract expression that is effectively invisible to
    API discovery because it is not reachable without a licence.
